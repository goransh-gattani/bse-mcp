[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bse-mcp"
version = "0.1.0"
description = "MCP server that gives Claude live BSE India (Bombay Stock Exchange) data by scrip code. Unofficial."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Goransh Gattani" }]
keywords = ["mcp", "bse", "bseindia", "stocks", "india", "claude", "model-context-protocol"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = ["mcp>=1.2"]

[project.optional-dependencies]
chrome = ["curl_cffi>=0.7"]   # Chrome TLS fingerprint; makes BSE far less likely to answer 403
test = ["pytest>=8"]

[project.scripts]
bse-mcp = "bse_mcp.server:main"

[project.urls]
Homepage = "https://github.com/goransh-gattani/bse-mcp"
Issues = "https://github.com/goransh-gattani/bse-mcp/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
