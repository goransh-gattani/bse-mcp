# Publishes to PyPI when a tag like v0.1.0 is pushed, using PyPI "trusted publishing" (no token to store).
# One-time setup on pypi.org: add a pending publisher for project "bse-mcp", owner goransh-gattani,
# repository bse-mcp, workflow publish.yml, environment pypi. The tag must match pyproject's version.
name: publish
on:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install build
      - run: python -m build
      - run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          test "$tag" = "$ver" || { echo "tag $tag != pyproject version $ver"; exit 1; }
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }
  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
